name: CI Pipeline - CodeFactory Solutions

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🧪 Executar Testes Unitários e de Integração
        run: npm test

      - name: 🐳 Validar Construção da Imagem Docker
        run: docker build -t codefactory-api:${{ github.sha }} .